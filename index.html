<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>たんごむチャレンジ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="eyebrow">MINI WORD GAME</div>
    <h1>たんごむ5チャレンジ</h1>
    <p>7文字をシャッフルして、<strong>tangomu</strong> を完成させよう！</p>
    <div class="letters" id="letters" aria-label="現在の文字列"></div>
    <div class="buttons">
      <button class="primary" id="shuffle">シャッフル！</button>
      <button class="secondary" id="reset">最初から</button>
      <button class="secondary" id="debug">🛠️ クリア演出テスト</button>
    </div>
    <div id="status" role="status" aria-live="polite">「シャッフル！」を押して挑戦しよう。</div>
    <div id="sparkle" class="sparkle" aria-hidden="true">🎉 ✨ 🎉</div>
    <div id="confetti" aria-hidden="true"></div>
    <div class="count">シャッフル回数：<span id="count">0</span></div>
  </main>
<script type="module">
  import { launchConfetti } from "./js/effects.js";
  const target = "tangomu";
  const DEBUG_MODE = false;
  const CHANCE = 1 / 30;

  let letters = [];
  let chanceLetters = [];
  let count = 0;
  let cleared = false;
  let chanceMode = false;
  let chanceStep = 0;

  const lettersEl = document.getElementById("letters");
  const statusEl = document.getElementById("status");
  const countEl = document.getElementById("count");
  const sparkleEl = document.getElementById("sparkle");
  const debugButton = document.getElementById("debug");
  const confettiEl = document.getElementById("confetti");

  debugButton.hidden = !DEBUG_MODE;

  function shuffledCopy() {
    const arr = target.split("");
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 通常時のシャッフル。偶然の正解も含めて判定する
  function render() {
    lettersEl.replaceChildren();

    letters.forEach((letter, index) => {
      const tile = document.createElement("span");
      tile.className = "letter" + (cleared ? " correct" : "");
      tile.textContent = letter;
      tile.setAttribute("aria-label", `${index + 1}文字目 ${letter}`);
      lettersEl.appendChild(tile);
    });
  }

  function winGame() {
    cleared = true;
    chanceMode = false;
    render();

    statusEl.textContent = "クリア！\n君が真のたんごむだ！";
    statusEl.classList.add("win");
    sparkleEl.classList.add("show");
    launchConfetti(confettiEl);
  }

  function shuffle() {
  if (cleared) return;

  count++;
  countEl.textContent = count;

  // たんごむチャンス中
  if (chanceMode) {
    // すでに7文字まで表示されていたら、通常モードに戻す
    if (chanceStep >= 4) {
      chanceMode = false;
      chanceStep = 0;

      letters = shuffledCopy();
      cleared = letters.join("") === target;
      render();

      if (cleared) {
        winGame();
      } else {
        statusEl.textContent = "まだまだ！ もう一回シャッフル！";
      }
      return;
    }

    // 次の1文字を追加
    letters.push(chanceLetters[chanceStep]);
    chanceStep++;

    if (letters.join("") === target) {
      winGame();
      return;
    }

    render();

    // 正しい順番で文字が並んでいるか確認
const current = letters.join("");

if (current === "tang" || current === "tango" || current === "tangom") {
  statusEl.textContent =
    "チャンス継続中！ 次の文字を出そう！";
} else {
  statusEl.textContent =
    "今回はハズレ！ もう一度押して再挑戦！";
}

    return;
  }

  // 通常モード：1/100の確率でチャンス発生
  if (Math.random() < CHANCE) {
    chanceMode = true;
    chanceStep = 0;

    chanceLetters = ["g", "o", "m", "u"];

    // 後ろ3文字をランダムに並べ替える
    for (let i = chanceLetters.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [chanceLetters[i], chanceLetters[j]] =
        [chanceLetters[j], chanceLetters[i]];
    }

    letters = ["t", "a", "n"];
    render();

    statusEl.textContent = "たんごむチャンス！";
    statusEl.classList.remove("win");
    sparkleEl.classList.remove("show");
    return;
  }

  // 通常のランダムシャッフル
  letters = shuffledCopy();
  cleared = letters.join("") === target;
  render();

  if (cleared) {
    winGame();
  } else {
    statusEl.textContent = "まだまだ！ もう一回シャッフル！";
    statusEl.classList.remove("win");
    sparkleEl.classList.remove("show");
  }
}

  function debugClear() {
    if (cleared) return;

    count++;
    countEl.textContent = count;
    letters = target.split("");
    winGame();
  }

  function reset() {
    count = 0;
    cleared = false;
    chanceMode = false;
    chanceStep = 0;
    countEl.textContent = "0";

    letters = shuffledCopy();
    if (letters.join("") === target) {
      letters = shuffledCopy();
    }

    render();
    statusEl.textContent = "「シャッフル！」を押して挑戦しよう。";
    statusEl.classList.remove("win");
    sparkleEl.classList.remove("show");
    confettiEl.replaceChildren();
  }

  document.getElementById("shuffle").addEventListener("click", shuffle);
  document.getElementById("reset").addEventListener("click", reset);
  debugButton.addEventListener("click", debugClear);

  reset();
</script>
</body>
</html>
