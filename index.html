<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>たんごむチャレンジ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="eyebrow">MINI WORD GAME</div>

    <h1>たんごむチャレンジ</h1>

    <p>7文字をシャッフルして、<strong>tangomu</strong> を完成させよう！</p>

    <div class="letters" id="letters" aria-label="現在の文字列"></div>

    <div class="buttons">
      <button class="primary" id="shuffle">シャッフル！</button>

      <button class="secondary" id="reset" hidden>最初から</button>

      <button class="secondary" id="debug" hidden>
        🛠️ クリア演出テスト
      </button>

      <button id="debugEete" hidden>
        紫シークレット：eete
      </button>

      <button id="debugTangomu" hidden>
        金シークレット：tangomu
      </button>
    </div>

    <div id="chanceOverlay" class="chance-overlay" aria-hidden="true">
      たんごむチャンス！
    </div>

    <div id="status" role="status" aria-live="polite">
      「シャッフル！」を押して挑戦しよう。
    </div>

    <div id="sparkle" class="sparkle" aria-hidden="true">
      🎉 ✨ 🎉
    </div>

    <div id="confetti" aria-hidden="true"></div>

    <div class="count">
      シャッフル回数：<span id="count">0</span>
    </div>
  </main>

  <script type="module" src="./js/game.js"></script>
</body>
</html>
