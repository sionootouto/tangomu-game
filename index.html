<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>たんごむチャレンジ</title>
  <style>
    :root { color-scheme: light; --ink:#202338; --accent:#6c5ce7; --bg:#f5f4ff; }
    * { box-sizing: border-box; }
    /* ボタン連打時のズームや選択を防ぐ */
button {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
      color: var(--ink); background: radial-gradient(circle at top, #e9e5ff, var(--bg) 58%);
    }
    main {
      width: min(100%, 520px); text-align: center; background: #fff;
      border: 1px solid #e9e7f6; border-radius: 28px; padding: 32px 22px;
      box-shadow: 0 18px 55px #3a2e8014;
    }
    .eyebrow { color: var(--accent); font-weight: 800; letter-spacing: .16em; font-size: .8rem; }
    h1 { margin: 8px 0 10px; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.04em; }
    p { line-height: 1.7; color: #66677a; margin: 0 auto; }
    .letters {
      display: flex; justify-content: center; flex-wrap: nowrap; gap: 4px;
      margin: 28px 0 22px; min-height: 66px;
    }
    .letter {
      width: clamp(0px, 8vw, 54px); height: clamp(46px, 12vw, 62px);
      display: grid; place-items: center; border-radius: 14px;
      background: #f0edff; color: #4938b4; font-size: clamp(1.35rem, 5vw, 1.8rem);
      font-weight: 850; box-shadow: inset 0 -3px #dcd5ff;
    }
    .letter.correct { background: #d9f8e7; color: #167747; box-shadow: inset 0 -3px #b5e9cc; }
    .buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 14px; padding: 13px 20px; font: inherit;
      font-weight: 750; cursor: pointer; transition: transform .12s, filter .12s;
    }
    button:hover { filter: brightness(.97); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    .primary { background: var(--accent); color: white; }
    .secondary { background: #f0eff7; color: #45445b; }
    #status { min-height: 2em; margin-top: 20px; font-weight: 750; color: #5c5b70; }
    #status.win { color: #16804a; font-size: 1.15rem; }
    .count { margin-top: 8px; font-size: .9rem; color: #9291a4; }
    .sparkle { display: none; font-size: 1.7rem; margin-top: 8px; }
    .sparkle.show { display: block; animation: pop .45s ease-out; }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
/* クリア時の紙吹雪 */
#confetti {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 9999;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 16px;
  animation: confetti-fall 3s ease-in forwards;
}

@keyframes confetti-fall {
  0% {
    transform: translateY(-20px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(900deg);
    opacity: 0;
  }
}
#debug[hidden] {
  display: none !important;
}

#status.win {
  white-space: pre-line;
  color: #16804a;
  font-size: 1.5rem;
  line-height: 1.8;
  animation: pop .5s ease-out;
}

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">MINI WORD GAME</div>
    <h1>たんごむ4チャレンジ</h1>
    <p>7文字をシャッフルして、<strong>tangomu</strong> を完成させよう！</p>
    <div class="letters" id="letters" aria-label="現在の文字列"></div>
    <div class="buttons">
      <button class="primary" id="shuffle">シャッフル！</button>
      <button class="secondary" id="reset">最初から</button>
      <button class="secondary" id="debug">🛠️ クリア演出テスト</button>
    </div>
    <div id="status" role="status" aria-live="polite">「シャッフル！」を押して挑戦しよう。</div>
    <div id="sparkle" class="sparkle" aria-hidden="true">🎉 ✨ 🎉</div>
    <div id="confetti" aria-hidden="true"></div>
    <div class="count">シャッフル回数：<span id="count">0</span></div>
  </main>
<script>
  const target = "tangomu";
  const DEBUG_MODE = false;
  const CHANCE = 1 / 30;

  let letters = [];
  let chanceLetters = [];
  let count = 0;
  let cleared = false;
  let chanceMode = false;
  let chanceStep = 0;

  const lettersEl = document.getElementById("letters");
  const statusEl = document.getElementById("status");
  const countEl = document.getElementById("count");
  const sparkleEl = document.getElementById("sparkle");
  const debugButton = document.getElementById("debug");
  const confettiEl = document.getElementById("confetti");

  debugButton.hidden = !DEBUG_MODE;

  function shuffledCopy() {
    const arr = target.split("");
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 通常時のシャッフル。偶然の正解も含めて判定する
  function render() {
    lettersEl.replaceChildren();

    letters.forEach((letter, index) => {
      const tile = document.createElement("span");
      tile.className = "letter" + (cleared ? " correct" : "");
      tile.textContent = letter;
      tile.setAttribute("aria-label", `${index + 1}文字目 ${letter}`);
      lettersEl.appendChild(tile);
    });
  }

  function launchConfetti() {
    const colors = [
      "#ff4d6d", "#ffd166", "#06d6a0",
      "#4dabf7", "#9b5de5", "#ff85c1"
    ];

    confettiEl.replaceChildren();

    for (let i = 0; i < 100; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 1.5 + "s";
      piece.style.animationDuration =
        (2.5 + Math.random() * 2) + "s";
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      confettiEl.appendChild(piece);
    }
  }

  function winGame() {
    cleared = true;
    chanceMode = false;
    render();

    statusEl.textContent = "クリア！\n君が真のたんごむだ！";
    statusEl.classList.add("win");
    sparkleEl.classList.add("show");
    launchConfetti();
  }

  function shuffle() {
  if (cleared) return;

  count++;
  countEl.textContent = count;

  // たんごむチャンス中
  if (chanceMode) {
    // すでに7文字まで表示されていたら、通常モードに戻す
    if (chanceStep >= 4) {
      chanceMode = false;
      chanceStep = 0;

      letters = shuffledCopy();
      cleared = letters.join("") === target;
      render();

      if (cleared) {
        winGame();
      } else {
        statusEl.textContent = "まだまだ！ もう一回シャッフル！";
      }
      return;
    }

    // 次の1文字を追加
    letters.push(chanceLetters[chanceStep]);
    chanceStep++;

    if (letters.join("") === target) {
      winGame();
      return;
    }

    render();

    // 正しい順番で文字が並んでいるか確認
const current = letters.join("");

if (current === "tang" || current === "tango" || current === "tangom") {
  statusEl.textContent =
    "チャンス継続中！ 次の文字を出そう！";
} else {
  statusEl.textContent =
    "今回はハズレ！ もう一度押して再挑戦！";
}

    return;
  }

  // 通常モード：1/100の確率でチャンス発生
  if (Math.random() < CHANCE) {
    chanceMode = true;
    chanceStep = 0;

    chanceLetters = ["g", "o", "m", "u"];

    // 後ろ3文字をランダムに並べ替える
    for (let i = chanceLetters.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [chanceLetters[i], chanceLetters[j]] =
        [chanceLetters[j], chanceLetters[i]];
    }

    letters = ["t", "a", "n"];
    render();

    statusEl.textContent = "たんごむチャンス！";
    statusEl.classList.remove("win");
    sparkleEl.classList.remove("show");
    return;
  }

  // 通常のランダムシャッフル
  letters = shuffledCopy();
  cleared = letters.join("") === target;
  render();

  if (cleared) {
    winGame();
  } else {
    statusEl.textContent = "まだまだ！ もう一回シャッフル！";
    statusEl.classList.remove("win");
    sparkleEl.classList.remove("show");
  }
}

  function debugClear() {
    if (cleared) return;

    count++;
    countEl.textContent = count;
    letters = target.split("");
    winGame();
  }

  function reset() {
    count = 0;
    cleared = false;
    chanceMode = false;
    chanceStep = 0;
    countEl.textContent = "0";

    letters = shuffledCopy();
    if (letters.join("") === target) {
      letters = shuffledCopy();
    }

    render();
    statusEl.textContent = "「シャッフル！」を押して挑戦しよう。";
    statusEl.classList.remove("win");
    sparkleEl.classList.remove("show");
    confettiEl.replaceChildren();
  }

  document.getElementById("shuffle").addEventListener("click", shuffle);
  document.getElementById("reset").addEventListener("click", reset);
  debugButton.addEventListener("click", debugClear);

  reset();
</script>
</body>
</html>
